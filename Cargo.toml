[package]
name = "pc-http"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
dotenvy = "0.15.7"
askama = "0.16.0"
sqlx = { version = "0.8.6", features = ["runtime-tokio-rustls", "postgres", "macros"] }
redis = { version = "1.6.0", features = ["tokio-comp", "r2d2"] }
uuid = { version = "1.24.1", features = ["v4"] }
jsonwebtoken = "11.0.0"
bcrypt = "0.19.3"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
